[defaults]
hash_behaviour = merge
retry_files_enabled = False
host_key_checking = False
callback_result_format = yaml

# inventory = inventory.yml
# executable = /bin/sh

# fact_caching は無効化する。ビルド/検証ワークフローでは毎回 gather する方が正確。
# 過去の実行(例: 古いポイントリリースの VM)のキャッシュが残ると、新しい VM でも
# 古いバージョン値が返り、prepare.yml のバージョン検証が誤って失敗するため。
gathering = smart
